<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cortex</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    #sidebar {
      width: 250px;
      background: #252526;
      border-right: 1px solid #3e3e42;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 12px;
      border-bottom: 1px solid #3e3e42;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #sidebar-header h3 {
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
    }
    #open-folder-btn {
      background: #0e639c;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }
    #open-folder-btn:hover {
      background: #1177bb;
    }
    #file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .file-item {
      padding: 4px 8px;
      cursor: pointer;
      font-size: 13px;
      border-radius: 3px;
      margin: 2px 0;
    }
    .file-item:hover {
      background: #2a2d2e;
    }
    .file-item.active {
      background: #094771;
    }
    .folder-item {
      font-weight: 500;
      color: #cccccc;
    }
    .folder-children {
      margin-left: 16px;
    }
    #editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #editor-header {
      padding: 12px 20px;
      border-bottom: 1px solid #3e3e42;
      font-size: 14px;
      color: #cccccc;
    }
    #editor {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .ProseMirror {
      outline: none;
      min-height: 100%;
      color: #d4d4d4;
    }
    .ProseMirror h1 {
      font-size: 2em;
      margin: 0.67em 0;
    }
    .ProseMirror h2 {
      font-size: 1.5em;
      margin: 0.75em 0;
    }
    .ProseMirror h3 {
      font-size: 1.17em;
      margin: 0.83em 0;
    }
    .ProseMirror ul,
    .ProseMirror ol {
      padding-left: 2em;
      margin: 0.5em 0;
    }
    .ProseMirror ul ul,
    .ProseMirror ol ol,
    .ProseMirror ul ol,
    .ProseMirror ol ul {
      margin: 0.25em 0;
    }
    .ProseMirror ul[data-type="taskList"] {
      list-style: none;
      padding-left: 0;
    }
    .ProseMirror ul[data-type="taskList"] li {
      display: flex;
      align-items: start;
      margin: 0.5em 0;
      padding-left: 0;
    }
    .ProseMirror ul[data-type="taskList"] ul[data-type="taskList"] {
      padding-left: 2em;
    }
    .ProseMirror ul[data-type="taskList"] ul[data-type="taskList"] li {
      padding-left: 0;
    }
    .ProseMirror ul[data-type="taskList"] li > label {
      flex: 0 0 auto;
      margin-right: 0.5em;
      user-select: none;
    }
    .ProseMirror ul[data-type="taskList"] li > div {
      flex: 1 1 auto;
    }
    .ProseMirror ul[data-type="taskList"] input[type="checkbox"] {
      cursor: pointer;
    }
    .ProseMirror mark {
      background-color: #ffeb3b;
      color: #000;
      padding: 0 2px;
      border-radius: 2px;
    }
    .ProseMirror table {
      border-collapse: collapse;
      margin: 1em 0;
      overflow: hidden;
    }
    .ProseMirror th,
    .ProseMirror td {
      border: 1px solid #3e3e42;
      padding: 8px 12px;
      vertical-align: top;
      position: relative;
    }
    .ProseMirror th {
      background: #2d2d30;
      font-weight: 600;
    }
    .ProseMirror td {
      background: #1e1e1e;
    }
    .ProseMirror code {
      background: #2d2d30;
      border-radius: 3px;
      padding: 2px 4px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9em;
    }
    .ProseMirror pre {
      background: #2d2d30;
      border-radius: 5px;
      padding: 12px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .ProseMirror pre code {
      background: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h3>Files</h3>
      <button id="open-folder-btn">Open Folder</button>
    </div>
    <div id="file-tree"></div>
  </div>
  <div id="editor-container">
    <div id="editor-header">No file opened</div>
    <div id="editor"></div>
  </div>
  <script src="dist/renderer.js"></script>
</body>
</html>
