<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cortex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h3>Files</h3>
      <button id="open-folder-btn">Open Folder</button>
    </div>
    <div id="file-tree"></div>
  </div>
  <div id="resize-handle"></div>
  <div id="editor-container">
    <div id="editor-header">
      <div id="header-left">
        <span class="header-label">Workspace</span>
        <span id="workspace-name">No workspace</span>
      </div>
      <div id="header-right">
        <label for="editor-filename-input" class="header-label">File</label>
        <input id="editor-filename-input" type="text" placeholder="No file opened" autocomplete="off" disabled aria-label="Current file name">
      </div>
    </div>
    <div id="editor"></div>
  </div>
  
  <!-- Quick Search Dialog -->
  <div id="search-overlay" class="search-overlay hidden">
    <div class="search-dialog">
      <div class="search-input-container">
        <input type="text" id="search-input" placeholder="Search files in vault..." autocomplete="off">
      </div>
      <div class="search-results" id="search-results">
        <div class="search-empty">Start typing to search...</div>
      </div>
    </div>
  </div>
  
  <script src="dist/renderer.js"></script>
</body>
</html>
